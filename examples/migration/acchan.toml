# Concrete acchan migration candidate; review docs/dotfiles-migration.md first.
# Source declarations: partanskiy/dotfiles at a24c97b5302235710c2ad82c64783d7103545296.
host = "acchan"
home_dir = "/home/geles"
data_dir = "/home/geles/.local/share/lyfy-migration/default"
state_dir = "/home/geles/.local/state/lyfy-migration"
include = []
check_packages = true
check_system = true
capture_errors = "strict"
install_packages = false
install_identities = false
restore_services = false
regenerate = false
selected_mounts = ["root-properties", "system", "config", "assistant", "home-tools", "desktop", "local", "platform", "boot-properties", "loader"]

# Persistent service intent only. No start/stop is performed.
system_resources = [
  { kind = "user", name = "geles" },
  { kind = "service", name = "bluetooth.service" },
  { kind = "service", name = "avahi-daemon.service" },
  { kind = "service", name = "avahi-daemon.socket" },
  { kind = "service", name = "NetworkManager-dispatcher.service" },
  { kind = "service", name = "NetworkManager.service" },
  { kind = "service", name = "NetworkManager-wait-online.service" },
  { kind = "service", name = "systemd-oomd.service" },
  { kind = "service", name = "systemd-oomd.socket" },
  { kind = "service", name = "systemd-resolved.service" },
  { kind = "service", name = "systemd-resolved-monitor.socket" },
  { kind = "service", name = "systemd-resolved-varlink.socket" },
  { kind = "service", name = "systemd-timesyncd.service" },
  { kind = "service", name = "getty@tty1.service" },
  { kind = "service", name = "getty@.service" },
  { kind = "service", name = "keyd.service" },
  { kind = "service", name = "nftables.service" },
  { kind = "service", name = "remote-fs.target" },
  { kind = "service", name = "cups.socket" },
  { kind = "service", name = "systemd-userdbd.socket" },
  { kind = "service", name = "systemd-boot-update.service" },
  { kind = "service", name = "fstrim.timer" },
]

[[backends]]
name = "configuration"
kind = "git"
path = "/home/geles/.local/share/lyfy-migration/configuration"

[[backends]]
name = "data"
kind = "directory"
path = "/home/geles/.local/share/lyfy-migration/data"

[[mounts]]
name = "root-properties"
path = "/"
backend = "configuration"
base_host = ""
properties_only = true
apply = true

[[mounts]]
name = "system"
path = "/etc"
backend = "configuration"
base_host = ""
apply = true
packages = true
system = true
include = [
  "/etc/X11/xorg.conf.d/00-keyboard.conf",
  "/etc/cups/classes.conf",
  "/etc/cups/ppd/HP_Laser_135r.ppd",
  "/etc/cups/printers.conf",
  "/etc/default/useradd",
  "/etc/fstab",
  "/etc/gitconfig",
  "/etc/hostname",
  "/etc/hosts",
  "/etc/iproute2/rt_tables",
  "/etc/kernel/cmdline",
  "/etc/keyd/default.conf",
  "/etc/locale.conf",
  "/etc/locale.gen",
  "/etc/localtime",
  "/etc/makepkg.conf.d/fortran.conf",
  "/etc/mkinitcpio.conf.d/10-nvidia.conf",
  "/etc/mkinitcpio.d/linux.preset",
  "/etc/modprobe.d/acer-blacklist.conf",
  "/etc/modprobe.d/acer-wmi-battery.conf",
  "/etc/modprobe.d/nvidia.conf",
  "/etc/nftables.conf",
  "/etc/nvidia/nvidia-application-profiles-rc.d/50-limit-free-buffer-pool-in-wayland-compositors.json",
  "/etc/os-release",
  "/etc/pacman.conf",
  "/etc/pacman.d/blackarch-mirrorlist",
  "/etc/pacman.d/mirrorlist",
  "/etc/resolv.conf.default",
  "/etc/shells",
  "/etc/sudoers",
  "/etc/sudoers.d/00_geles",
  "/etc/sudoers.d/wc_copy",
  "/etc/systemd/journald.conf.d/50-size-limit.conf",
  "/etc/systemd/system",
  "/etc/systemd/user",
  "/etc/systemd/zram-generator.conf",
  "/etc/tmpfiles.d/geles-media.conf",
  "/etc/tpm2-tss/fapi-profiles/P_ECCP384SHA384.json",
  "/etc/tpm2-tss/fapi-profiles/P_RSA3072SHA384.json",
  "/etc/udev/rules.d/70-u2f.rules",
  "/etc/udev/rules.d/90-gpu-devlinks.rules",
  "/etc/vconsole.conf",
]
exclude = ["/etc/exchange-private", "/etc/sing-box", "/etc/xray", "/etc/systemd/system/sing-box.service", "/etc/systemd/system/sing-box.service.d", "/etc/systemd/system/vpn-boot.service", "/etc/systemd/system/xray@.service.d", "/etc/systemd/system/multi-user.target.wants/vpn-boot.service"]

[[mounts]]
name = "config"
path = "~/.config"
backend = "configuration"
base_host = ""
apply = true
include = [
  "~/.config/btop",
  "~/.config/fastfetch",
  "~/.config/fish",
  "~/.config/git",
  "~/.config/go",
  "~/.config/helix",
  "~/.config/kitty",
  "~/.config/mimeapps.list",
  "~/.config/niri",
  "~/.config/niri-autostart",
  "~/.config/noctalia",
  "~/.config/paru",
  "~/.config/mpv",
  "~/.config/starship",
  "~/.config/starship.toml",
  "~/.config/synchrogit",
  "~/.config/systemd",
  "~/.config/user-dirs.dirs",
  "~/.config/user-dirs.locale",
  "~/.config/uwsm",
  "~/.config/xdg-desktop-portal",
]

[[mounts]]
name = "assistant"
path = "~/.claude"
backend = "configuration"
base_host = ""
apply = true
include = ["~/.claude/settings.json"]

[[mounts]]
name = "home-tools"
path = "~/.local/bin"
backend = "configuration"
base_host = ""
apply = true

[[mounts]]
name = "desktop"
path = "~/.local/share/applications"
backend = "configuration"
base_host = ""
apply = true

[[mounts]]
name = "local"
path = "/usr/local"
backend = "configuration"
base_host = ""
apply = true
include = ["/usr/local/bin/nvidia-info-json"]

[[mounts]]
name = "platform"
path = "/usr"
backend = "configuration"
base_host = ""
apply = true
include = ["/usr/lib/jvm/default", "/usr/lib/jvm/default-runtime", "/usr/lib/libvsscript.so", "/usr/share/cups/usb/hp-laser-135r.usb-quirks", "/usr/share/pacman/keyrings/blackarch-revoked", "/usr/share/pacman/keyrings/blackarch-trusted", "/usr/share/pacman/keyrings/blackarch.gpg"]

[[mounts]]
name = "boot-properties"
path = "/boot"
backend = "configuration"
base_host = ""
apply = true
properties_only = true
external = { recovery = "independent_copy" }

[[mounts]]
name = "loader"
path = "/boot/loader"
backend = "configuration"
base_host = ""
apply = true
include = ["/boot/loader/loader.conf"]

[[mounts]]
name = "pictures"
path = "~/Pictures"
backend = "data"
base_host = ""
apply = false
history = "retained"
retain = 10

[[mounts]]
name = "projects"
path = "~/Projects"
backend = "data"
base_host = ""
apply = false
history = "retained"
retain = 10

[[mounts]]
name = "lyfy-project"
path = "~/Projects/Personal/lyfy"
backend = "data"
base_host = ""
apply = false
git_project = true
exclude = ["~/Projects/Personal/lyfy/target"]
