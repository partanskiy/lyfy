# Synthetic example. Replace logical paths and physical storage destinations.
host = "laptop"
home_dir = "/home/example"
data_dir = "/home/example/.local/share/lyfy/default"
state_dir = "/home/example/.local/state/lyfy"
include = []
capture_errors = "strict"
check_packages = true
check_system = true
selected_mounts = ["config"]

[[backends]]
name = "configuration"
kind = "git"
path = "/home/example/.local/share/lyfy/configuration"

[[backends]]
name = "data"
kind = "directory"
path = "/home/example/Backups/lyfy"

[[mounts]]
name = "config"
path = "~/.config"
backend = "configuration"
apply = true
include = ["~/.config/editor", "~/.config/terminal"]

[[mounts]]
name = "system"
path = "/etc"
backend = "configuration"
base_host = ""
packages = true
system = true
include = ["/etc/hostname", "/etc/locale.conf"]

[[mounts]]
name = "pictures"
path = "~/Pictures"
backend = "data"
history = "retained"
retain = 10

[[mounts]]
name = "projects"
path = "~/Projects"
backend = "data"

[[mounts]]
name = "demo-project"
path = "~/Projects/demo"
backend = "data"
git_project = true
exclude = ["~/Projects/demo/build"]
