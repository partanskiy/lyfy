name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-architecture.py
      - run: python3 scripts/test-architecture.py
      - run: bash scripts/test-version.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed rust git pkgconf libarchive
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed rust git pkgconf libarchive
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked
      - name: Library without launch dependencies
        run: |
          cargo test -p lyfy --locked
          bash scripts/check-library-deps.sh

  build:
    name: release build
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed rust git pkgconf libarchive
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p lyfy-cli --bin lyfy
      - run: cargo build -p lyfy --locked --release

  commits:
    name: validate commits
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every PR commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-commits.sh --range "$BASE..$HEAD"

  arch-package:
    name: Arch package (x86_64)
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install pacman-managed build dependencies
        run: pacman -Syu --noconfirm --needed rust python git systemd groff pkgconf libarchive licenses
      - uses: actions/checkout@v4
      - name: Build and inspect the source package as an unprivileged user
        run: |
          bash scripts/test-version.sh
          install -d -m755 -o nobody -g nobody /tmp/lyfy-arch-package
          runuser -u nobody -- env CARGO_HOME=/tmp/lyfy-arch-package/cargo \
            bash scripts/check-arch-package.sh 26.10.0 /tmp/lyfy-arch-package
