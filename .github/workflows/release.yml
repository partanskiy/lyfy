name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the selected release commit
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate and build the tagged source
        run: |
          python3 scripts/check-architecture.py
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-features --locked
          cargo test --lib --test api --no-default-features --locked
          LYFY_BUILD_VERSION="${RELEASE_TAG#v}" cargo build --locked --release
          test "$(target/release/lyfy --version)" = "lyfy ${RELEASE_TAG#v}"
      - name: Create archive
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/lyfy-$RELEASE_TAG-x86_64-unknown-linux-gnu.tar.gz" lyfy
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Publish the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "lyfy $RELEASE_TAG"
