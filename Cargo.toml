[package]
name = "lyfy"
version = "26.10.0"
edition = "2024"
rust-version = "1.88"
description = "Declarative system maintenance for Arch Linux"
repository = "https://github.com/partanskiy/lyfy"
license = "MIT"

[package.metadata.lyfy]
binary-license = "GPL-3.0-only"

[dependencies]
alpm = { version = "5.0.2", features = ["mtree"] }
libarchive = "0.1.1"
libarchive3-sys = "0.1.2"
glob = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"], optional = true }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = { version = "0.8", optional = true }
walkdir = "2"
indicatif = { version = "0.18", optional = true }
console = { version = "0.16", optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
percent-encoding = { version = "2", optional = true }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:toml", "dep:indicatif", "dep:console", "dep:serde_yaml_ng", "dep:percent-encoding"]

[[bin]]
name = "lyfy"
path = "src/bin/lyfy/main.rs"
required-features = ["cli"]

[[test]]
name = "config"
required-features = ["cli"]

[[test]]
name = "lint"
required-features = ["cli"]

[[test]]
name = "safety"
required-features = ["cli"]

[[test]]
name = "state"
required-features = ["cli"]

[[test]]
name = "git"
required-features = ["cli"]

[[test]]
name = "native"
required-features = ["cli"]
