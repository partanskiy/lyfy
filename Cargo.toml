[package]
name = "lyfy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Declarative system maintenance for Arch Linux"
repository = "https://github.com/partanskiy/lyfy"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
lyfy-core = { path = "crates/lyfy-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"

[workspace]
members = ["crates/lyfy-core"]
resolver = "3"
