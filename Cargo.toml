[workspace]
members = ["crates/lyfy", "crates/lyfy-cli"]
resolver = "3"

[workspace.package]
version = "26.10.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/partanskiy/lyfy"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
