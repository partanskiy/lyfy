[package]
name = "lyfy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Declarative system maintenance for Arch Linux"
repository = "https://github.com/partanskiy/lyfy"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
walkdir = "2"
