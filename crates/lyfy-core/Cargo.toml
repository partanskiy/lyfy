[package]
name = "lyfy-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Arch Linux maintenance logic, independent of launch inputs"
repository = "https://github.com/partanskiy/lyfy"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
