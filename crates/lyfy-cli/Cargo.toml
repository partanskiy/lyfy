[package]
name = "lyfy-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Declarative system maintenance for Arch Linux"
autobins = false
autolib = false

[package.metadata.lyfy]
binary-license = "GPL-3.0-only"

[[bin]]
name = "lyfy"
path = "src/main.rs"

[dependencies]
lyfy = { path = "../lyfy" }
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml = "0.8"
indicatif = "0.18"
console = "0.16"
serde_yaml_ng = "0.10"
percent-encoding = "2"
